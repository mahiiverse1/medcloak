services:
  - type: web
    name: medcloak-demo
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MEDCLOAK_DEPLOYMENT_MODE
        value: hosted_demo
